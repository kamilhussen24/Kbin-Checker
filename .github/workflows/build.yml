name: Build KBin Checker

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build?'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Google Play needs a higher versionCode on every upload, so the run number is used.
  VERSION_CODE: ${{ github.run_number }}
  # Recommended. Address of your Cloudflare Worker relay, see server/README.md.
  BIN_API_URL: ${{ secrets.BIN_API_URL }}
  # Only for direct provider calls without a relay. Leave unset when BIN_API_URL is used.
  BIN_API_KEY: ${{ secrets.BIN_API_KEY }}

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      # Get version from app/build.gradle.kts
      - name: Get Version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (code $VERSION_CODE)"

      # ── Debug ─────────────────────────────────────────────────────
      - name: Build Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kbin-checker-debug-apk-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── Release ───────────────────────────────────────────────────
      - name: Check signing secrets
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README.md, section 'Release signing'."
            exit 1
          fi

      - name: Decode Keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/android.keystore

      - name: Build Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew bundleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kbin-checker-release-apk-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: kbin-checker-release-aab-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: KBin Checker v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: KBin Checker v${{ steps.version.outputs.version }}, versionCode ${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## KBin Checker v${{ steps.version.outputs.version }} (versionCode $VERSION_CODE)" >> $GITHUB_STEP_SUMMARY
          echo "| File | Use |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" != "release" ]; then
            echo "| debug-apk | Testing on your phone |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.build_type }}" != "debug" ]; then
            echo "| release-apk | Direct install |" >> $GITHUB_STEP_SUMMARY
            echo "| release-aab | Upload to Google Play |" >> $GITHUB_STEP_SUMMARY
          fi
