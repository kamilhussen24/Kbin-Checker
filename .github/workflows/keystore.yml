name: Generate Release Keystore

# Run this ONCE, before the first release build.
# It creates the upload key that signs every release of KBin Checker.
#
# Before running, add these repository secrets (Settings > Secrets and variables > Actions):
#   STORE_PASSWORD  at least 6 characters
#   KEY_PASSWORD    at least 6 characters
#   KEY_ALIAS       for example: kbin
#
# Keep the repository PRIVATE: the keystore is offered as a downloadable artifact for one day.

on:
  workflow_dispatch:
    inputs:
      owner_name:
        description: 'Name stored inside the certificate'
        required: true
        default: 'KDex'
      confirm:
        description: 'Type YES to confirm. Never replace a key that is already used on Google Play.'
        required: true
        default: 'NO'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  keystore:
    name: Generate keystore
    runs-on: ubuntu-latest
    if: inputs.confirm == 'YES'

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OWNER_NAME: ${{ inputs.owner_name }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Add the STORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS secrets first."
            exit 1
          fi
          mkdir out
          keytool -genkeypair -noprompt \
            -keystore out/android.keystore -storetype JKS \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=$OWNER_NAME"
          base64 -w 0 out/android.keystore > out/keystore_base64.txt
          keytool -list -v -keystore out/android.keystore -storepass "$STORE_PASSWORD" \
            | grep -E "Alias name|Valid from|SHA1|SHA256" > out/fingerprints.txt
          cat out/fingerprints.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: kbin-checker-keystore
          path: out/
          retention-days: 1

      - name: Next steps
        run: |
          echo "## Keystore created" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the **kbin-checker-keystore** artifact and keep the zip somewhere safe." >> $GITHUB_STEP_SUMMARY
          echo "2. Open \`keystore_base64.txt\`, copy everything, and save it as the **KEYSTORE_BASE64** secret." >> $GITHUB_STEP_SUMMARY
          echo "3. Delete this workflow run so the artifact is removed." >> $GITHUB_STEP_SUMMARY
          echo "4. Run **Build KBin Checker** with \`release\`." >> $GITHUB_STEP_SUMMARY
